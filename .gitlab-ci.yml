stages:
  - image

image-nejla-build:
  stage: image
  variables:
    DIR: nejla-build
    IMAGE_NAME: $CI_REGISTRY_IMAGE/nejla-build
    DESTINATION: $IMAGE_NAME:$CI_COMMIT_SHA
    EXTRA_DESTINATION: $IMAGE_NAME:latest
  image:
    # The debug image contains the shell needed by gitlab-ci, resetting the
    # entrypoint makes it available as a command
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" \
      > /kaniko/.docker/config.json
  script:
    - if [ "$CI_COMMIT_BRANCH" = "master" ]; then EXTRA_ARGS="--destination $EXTRA_DESTINATION"; fi
    - 'echo "Building with --destination $DESTINATION $EXTRA_ARGS"'
    - /kaniko/executor --context "$CI_PROJECT_DIR/$DIR"
                       --dockerfile "$CI_PROJECT_DIR/$DIR/Dockerfile"
                       --cache=true
                       --destination "$DESTINATION"
                       $EXTRA_ARGS
    - 'echo "Built: $DESTINATION"'
